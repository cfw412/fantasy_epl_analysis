name: Pull FPL data

on:
  schedule:
    - cron: "15 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpl-data
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Pull season data (prices, form, fixtures)
        run: python fpl_pull.py

      - name: Pull gameweek review data (picks, points, transfers)
        run: python fpl_review_pull.py

      - name: Commit changes
        run: |
          git config user.name "fpl-data-bot"
          git config user.email "fpl-data-bot@users.noreply.github.com"
          git add fpl_data.json data/gw_review.json
          git diff --staged --quiet || git commit -m "Update FPL data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push