name: Pull FPL data

on:
  schedule:
    - cron: "15 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpl-data
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Pull season data (prices, form, fixtures)
        run: python fpl_pull.py --team-id 4455838

      - name: Pull gameweek review data (picks, points, transfers)
        run: |
          mkdir -p data
          python fpl_review_pull.py

      - name: Commit and push changes
        run: |
          git config user.name "fpl-data-bot"
          git config user.email "fpl-data-bot@users.noreply.github.com"
          git add fpl_data.json data/gw_review.json

          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Update FPL data $(date -u +%Y-%m-%dT%H:%MZ)"

          for i in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 10 + 1))
          done
          echo "Failed to push after retries."
          exit 1
